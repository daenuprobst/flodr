name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      # the lock resolves the CUDA wheels of torch; the runner has no GPU and the tests pin
      # device="cpu", so torch comes from the CPU index instead
      - name: Install with the dev extra and a CPU-only torch
        run: |
          uv sync --extra dev --no-install-package torch --python ${{ matrix.python }}
          uv pip install "torch>=2.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: uv run ruff check src tests
      - name: Tests
        run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - name: Build the sdist and wheel, install the wheel in a fresh environment, import it
        run: |
          uv build
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl --extra-index-url https://download.pytorch.org/whl/cpu
          /tmp/smoke/bin/python -c "import importlib.metadata, flodr; print(importlib.metadata.version('flodr'))"
