[project]
name = "flodr"
version = "0.1.0"
description = "FloDR: exactly invertible dimensionality reduction built on a normalizing flow"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Probst", email = "daenuprobst@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.7",
    "torch>=2.1",
    "usearch>=2.25.3",
    "typing-extensions>=4.15",
    "mnist1d>=0.0.2.post1",
]

[project.optional-dependencies]
# what the reproduction scripts under scripts/ import on top of the core package
paper = [
    "scanpy>=1.10",
    "anndata>=0.10",
    "pandas>=2.0",
    "opentsne>=1.0",
    "umap-learn>=0.5",
    "pacmap>=0.7",
    "pymde>=0.1",
    "faiss-cpu>=1.8",
    "drfp>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flodr"]
