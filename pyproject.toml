[project]
name = "flodr"
version = "0.1.0"
description = "FloDR: exactly invertible dimensionality reduction built on a normalizing flow"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Probst", email = "daenuprobst@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.6",
    "matplotlib>=3.7",
    "torch>=2.1",
    "usearch>=2.25.3",
    "typing-extensions>=4.15",
    "tqdm>=4.66",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
# what the reproduction scripts under scripts/ import on top of the core package
paper = [
    "scanpy>=1.10",
    "anndata>=0.10",
    "pandas>=2.0",
    "opentsne>=1.0",
    "umap-learn>=0.5",
    "pacmap>=0.7",
    "pymde>=0.1",
    "trimap>=1.1",
    "phate>=1.0",
    "umato>=1.0",
    "faiss-cpu>=1.8",
    "drfp>=0.3",
    # HNOCA: range-reads obsm out of the remote h5ad
    "fsspec>=2024.2",
    "aiohttp>=3.9",
    "pillow>=10.0",
]

# examples/quickstart.ipynb
notebook = [
    "nbformat>=5.9",
    "nbconvert>=7.0",
    "ipykernel>=6.29",
]

# tests/ and the CI workflow
dev = [
    "pytest>=8.0",
    "pandas>=2.0",
    "ruff>=0.5",
    "black>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flodr"]

# the source distribution carries the package and the two files its metadata points to; scripts,
# tests, examples and data stay in the repository
[tool.hatch.build.targets.sdist]
only-include = ["src/flodr", "README.md", "LICENSE"]

# black formats, ruff lints; both at black's default width
[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

# CI lints with the pyflakes rules and the pycodestyle errors that are real defects; the
# package's long why-comments and dict() calls are its house style, not findings
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
